name: Test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Reflects GitLab rules:
    # - push only on default branch
    # - all merge request events
#    if: >-
#      github.event_name == 'pull_request' ||
#      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    container:
      image: dockware/dev:6.6.8.2
      options: --user 0

    env:
      PROJECT_ROOT: /var/www/html
      PWA_DIR: /var/www/pwa
      WEB_DOCUMENT_ROOT: /var/www/html/public
      LOG_STDOUT: /var/www/html/var/log/stdout.log
      NPM_CONFIG_CACHE: /var/www/html/.cache/npm
      PM2_HOME: /var/www/html/.cache/pm2
      COMPOSER_HOME: /var/www/html/.cache/composer
      DOCKWARE_CI: '1'
      SW_API_ACCESS_KEY: 'SWSCS3JDYJVWYNLUNW1YDENIAG'
      SW_ACCESS_KEY: 'SWSCS3JDYJVWYNLUNW1YDENIAG'
      SW_LANG_ID: '2fbb5fe2e29a4d70aa5854ce7ce3e20b'
      APP_ENV: dev
      APP_DEBUG: '0'
      XDEBUG_ENABLED: '0'
      PHP_VERSION: '8.2'
      PLATFORM_BRANCH: '6.6.8.2'
      PLUGIN_NAME: SgateWebcheckoutSW6
      PLUGIN_COMPOSER: shopgate/webcheckout-shopware6
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      SG_USER: ${{ secrets.SG_USER }}
      SG_PASS: ${{ secrets.SG_PASS }}
      APP_ID: ${{ secrets.APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cache (pull-only behavior)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ${{ env.PLUGIN_NAME }}-${{ env.PLATFORM_BRANCH }}

      - name: Before script
        shell: bash
        run: |
          set -euo pipefail

          retry_cmd() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2
            local attempt=1

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "Command failed (attempt ${attempt}/${max_attempts}), retrying in ${delay_seconds}s: $*"
              attempt=$((attempt + 1))
              sleep "$delay_seconds"
            done
          }

          export LANG="en_US.UTF-8"
          export APP_URL="http://$HOSTNAME"
          export SW_ENDPOINT="$APP_URL"

          cd "$PROJECT_ROOT"
          [ -d "$CI_PROJECT_DIR/.cache" ] && mv "$CI_PROJECT_DIR/.cache" "$PROJECT_ROOT/"

          # GitHub container jobs can skip image entrypoint startup. Try to start DB service explicitly.
          if command -v service >/dev/null 2>&1; then
            service mysql start >/dev/null 2>&1 || true
            service mariadb start >/dev/null 2>&1 || true
          fi

          make -C "$PROJECT_ROOT/../" xdebug-off
          composer require --prefer-source "$PLUGIN_COMPOSER"
          retry_cmd 20 3 bin/console plugin:refresh --quiet
          bin/console plugin:install --activate "$PLUGIN_NAME" --quiet
          bin/console sales-channel:update:domain "$HOSTNAME"
          bin/console secrets:set APP_SECRET --random --quiet
          bin/console secrets:set APP_SECRET --random --local --quiet
          bin/console secrets:list --reveal

          if bin/console debug:container --parameter kernel.plugin_infos --format json | grep -q "$PLUGIN_NAME"; then
            echo "$PLUGIN_NAME is active"
          else
            echo "$PLUGIN_NAME is not active"
            exit 1
          fi

          mkdir -p "$PWA_DIR"
          cd "$PWA_DIR"
          nvm install 12.22.10 --default
          npm set unsafe-perm true --silent
          npm install --silent -g @shopgate/platform-sdk@1.11.2
          sgconnect login --username "${SG_USER}" --password "${SG_PASS}"
          sgconnect init --appId "${APP_ID}" --force

          cd "${PWA_DIR}/extensions"
          mkdir -p "${PWA_DIR}/extensions/${CI_PROJECT_NAME}"
          cp -r "$CI_PROJECT_DIR"/* "${PWA_DIR}/extensions/${CI_PROJECT_NAME}"
          npm run init:ci --silent --prefix "${PWA_DIR}/extensions/${CI_PROJECT_NAME}/extension"

          touch "$CI_PROJECT_DIR/backend_output.log"
          sgconnect backend start >> "$CI_PROJECT_DIR/backend_output.log" 2>&1 &

          while IFS= read -r line; do
            if echo "$line" | grep -q "Pipeline proxy is listening on 8090"; then
              echo "Backend started successfully"
              break
            fi
          done < <(tail -f "$CI_PROJECT_DIR/backend_output.log")

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          export APP_URL="http://$HOSTNAME"
          cd "$CI_PROJECT_DIR/tests"
          npm install
          npm run postman-ci -- \
            --env-var="sw_host=$APP_URL" \
            --env-var="domain=$APP_URL:8090" \
            --reporter-htmlextra-export="$CI_PROJECT_DIR/postman-report.html" \
            --reporter-junitfull-export="$CI_PROJECT_DIR/newman.junit.xml"

      - name: After script
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          tar -czvf "$CI_PROJECT_DIR/var_folder.tar.gz" var/log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: |
            postman-report.html
            backend_output.log
            var_folder.tar.gz
            newman.junit.xml
          if-no-files-found: warn
          retention-days: 3